name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: prod
    env:
      SYMFONY_ENV: ${{ vars.SYMFONY_ENV || 'preprod' }}
      DEPLOY_PATH: ${{ vars.OVH_DEPLOY_PATH || '.' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, libxml, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: |
          set +e
          yarn build 2>&1 | tee /tmp/build-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "==================== BUILD ERRORS (détail) ===================="
            grep -nE "ERROR in|Module not found|Can't resolve|SassError|Error:|throw|Unexpected" -A 25 /tmp/build-output.log | grep -vE "webpack\.Progress" | head -200
            echo "==============================================================="
          fi
          exit $code

      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          missing=""
          for v in OVH_SSH_KEY OVH_SSH_HOST OVH_SSH_PORT OVH_SSH_USER; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) manquant(s) dans l'environnement 'prod' :$missing"
            echo "Définir ces secrets dans Settings > Environments > l'environnement correspondant à la branche poussée."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$OVH_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$OVH_SSH_PORT" -H "$OVH_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy with rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.OVH_SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ssh/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='.env.preprod' \
            --exclude='.env.prod' \
            --exclude='.env.dev' \
            --exclude='.env.test' \
            --exclude='var/' \
            --exclude='public/medias/' \
            --exclude='public/uploads/' \
            --exclude='public/thumbnails/' \
            --exclude='public/geo-json/' \
            --exclude='public/feed/' \
            --exclude='public/compressor/' \
            --exclude='public/log/' \
            --exclude='public/manifest.*' \
            ./ "${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SSH_HOST }}:$DEPLOY_PATH/"

      # OVH mutualisé (cluster homez) n'expose pas PHP 8.5 en CLI : le web tourne en
      # 8.5 mais le `php` SSH est une vieille version. On ne lance donc aucune commande
      # `php` sur le serveur. On vide le cache prod (shell pur) ; Symfony le reconstruit
      # au premier accès web (PHP 8.5), pré-réchauffé par l'étape suivante.
      - name: Post-deploy (vidage cache, sans PHP CLI sur l'hôte)
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.OVH_SSH_PORT }}" \
            "${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SSH_HOST }}" \
            "cd '$DEPLOY_PATH' && rm -rf var/cache/$SYMFONY_ENV && echo \"cache $SYMFONY_ENV cleared\""

      # Pre-warm the home so the first real visitor never hits a cold cache rebuild
      # (the post-deploy step cleared var/cache, so the next hit recompiles everything).
      # The runner absorbs that cold rebuild here, not a real visitor.
      - name: Warm front (FPM + Liip thumbnails)
        continue-on-error: true
        env:
          BASE: ${{ vars.SITE_URL || 'https://www.up.abcvd.com' }}
        run: |
          echo "Warming $BASE"
          # Retry until 200: the first hit rebuilds the cache and may exceed Varnish timeout once.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$BASE/?warm=$i" || echo 000)
            echo "warm try $i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 4
          done
          # Pre-generate referenced Liip thumbnails (carousel + above-the-fold images).
          HTML=$(curl -s --max-time 90 "$BASE/?warm=final" || true)
          printf '%s' "$HTML" | grep -oE '(https?://[^"]*)?/thumbnails/[^"]+\.(webp|jpe?g|png)' | sort -u | head -n 60 \
            | while read -r u; do
                case "$u" in https://*) URL="$u";; *) URL="$BASE$u";; esac
                curl -s -o /dev/null --max-time 30 "$URL" || true
              done
          curl -s -o /dev/null --max-time 90 "$BASE/" || true
          echo "Warm done"
