name: Deploy to OVH

on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}
    env:
      SYMFONY_ENV: ${{ vars.SYMFONY_ENV || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, libxml, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: |
          set +e
          yarn build 2>&1 | tee build-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "==================== BUILD ERRORS (détail) ===================="
            grep -nE "ERROR in|Module not found|Can't resolve|SassError|Error:|throw|Unexpected" -A 25 build-output.log | grep -vE "webpack\.Progress" | head -200
            echo "==============================================================="
          fi
          exit $code

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.OVH_SSH_PORT }}" -H "${{ secrets.OVH_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.OVH_SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='var/' \
            --exclude='public/medias/' \
            ./ "${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SSH_HOST }}:${{ secrets.OVH_DEPLOY_PATH }}/"

      # OVH mutualisé (cluster homez) n'expose pas PHP 8.5 en CLI : le web tourne en
      # 8.5 mais le `php` SSH est une vieille version. On ne lance donc aucune commande
      # `php` sur le serveur. On vide le cache prod (shell pur) ; Symfony le reconstruit
      # au premier accès web (PHP 8.5), pré-réchauffé par l'étape suivante.
      - name: Post-deploy (vidage cache prod, sans PHP CLI sur l'hôte)
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.OVH_SSH_PORT }}" \
            "${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SSH_HOST }}" \
            "cd ${{ secrets.OVH_DEPLOY_PATH }} && rm -rf var/cache/$SYMFONY_ENV && echo 'prod cache cleared'"

      # Pre-warm the home so the first real visitor never hits a cold FPM pool or
      # ungenerated Liip thumbnails (avoids a transient CLS on the carousel image).
      # Requires the environment variable SITE_URL (e.g. https://www.up-animation.fr).
      - name: Warm front (FPM + Liip thumbnails)
        if: ${{ vars.SITE_URL != '' }}
        continue-on-error: true
        run: |
          BASE="${{ vars.SITE_URL }}"
          echo "Warming $BASE"
          # Fresh render (cache-busting query) to obtain the current thumbnail URLs and wake FPM.
          HTML=$(curl -s --max-time 90 "$BASE/?warm=$(date +%s)" || true)
          # Pre-generate every referenced Liip thumbnail (carousel + above-the-fold images).
          printf '%s' "$HTML" | grep -oE '(https?://[^"]*)?/thumbnails/[^"]+\.(webp|jpe?g|png)' | sort -u | head -n 60 \
            | while read -r u; do
                case "$u" in https://*) URL="$u";; *) URL="$BASE$u";; esac
                curl -s -o /dev/null --max-time 30 "$URL" || true
              done
          # Prime the canonical home (cached fragment) once thumbnails exist.
          curl -s -o /dev/null --max-time 90 "$BASE/" || true
          echo "Warm done"
