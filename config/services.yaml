# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# config/services.yaml

parameters:
    .container.dumper.inline_factories: true
    # Default when the env var is unset (.env is gitignored): web-cron enabled.
    env(SCHEDULER_WEB_CRON_ENABLED): 'true'
    # PageSpeed Insights defaults when the env var is unset (.env is gitignored).
    env(PAGESPEED_ENABLED): 'false'
    env(PAGESPEED_API_KEY): ''
    env(PAGESPEED_STRATEGIES): 'mobile'

services:

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%projectDir%'
            $logDir: '%logDir%'
            $cacheDir: '%cacheDir%'
            $prefix: '%prefix%'
            $isDebug: '%isDebug%'
            $appProtocol: '%protocol%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Routing\ExtraLoader:
        tags: [routing.loader]

    App\Controller\ExceptionController:
        public: true

    #####################################
    #           Listener                #
    #####################################

    App\EventListener\RequestListener:
        lazy: true
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

    App\EventListener\ExceptionListener:
        lazy: true
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    #####################################
    #           Subscriber              #
    #####################################

    App\EventSubscriber\LocaleSubscriber:
        lazy: true
        arguments:
            $defaultLocale: '%kernel.default_locale%'
        tags:
            - { name: kernel.event_subscriber, priority: 20 }

    App\EventSubscriber\SecurityPolicySubscriber:
        lazy: true
        tags:
            - { name: kernel.event_subscriber, priority: 20 }

    App\EventSubscriber\AdminTwoFactorRequiredSubscriber:
        lazy: true
        tags:
            - { name: kernel.event_subscriber }

    App\EventSubscriber\SlowRequestSubscriber:
        arguments:
            $slowRequestLogger: '@monolog.logger.slow_request'
            $statsService: '@App\Service\Core\SlowRequestStatsService'
            $queryProfiler: '@App\Doctrine\Middleware\QueryProfiler'
            $thresholdMs: '%env(int:SLOW_REQUEST_THRESHOLD_MS)%'
            $enabled: '%env(bool:SLOW_REQUEST_ENABLED)%'
            $serverTimingEnabled: '%kernel.debug%'
        tags:
            - { name: kernel.event_subscriber }

    App\Service\Core\SlowRequestStatsService:
        arguments:
            $logDir: '%kernel.logs_dir%'
            $cache: '@cache.app'
        lazy: true

    App\Service\Core\CronHeartbeatService:
        arguments:
            $schedulerLogger: '@monolog.logger.scheduler'
            $enabled: '%env(bool:SCHEDULER_WEB_CRON_ENABLED)%'

    #####################################
    #         Translation               #
    #####################################

    App\Service\Translation\Loader:
        arguments:
            $translationRepository: '@App\Repository\Translation\TranslationRepository'
            $websiteRepository: '@App\Repository\Core\WebsiteRepository'
            $requestStack: '@request_stack'
        tags:
            - { name: translation.loader, alias: db, priority: 20 }

    App\Service\Translation\Provider\DeepLProvider:
        arguments:
            $cache: '@cache.app'
            $translationLogger: '@monolog.logger.translation'
            $apiKey: '%env(DEEPL_API_KEY)%'
            $enabled: '%env(bool:DEEPL_ENABLED)%'
        tags:
            - { name: app.translator_provider, priority: 30 }

    App\Service\Translation\Provider\MyMemoryProvider:
        arguments:
            $cache: '@cache.app'
            $translationLogger: '@monolog.logger.translation'
            $email: '%env(MYMEMORY_EMAIL)%'
        tags:
            - { name: app.translator_provider, priority: 20 }

    App\Service\Translation\Provider\LibreTranslateProvider:
        arguments:
            $url: '%env(LIBRETRANSLATE_URL)%'
            $apiKey: '%env(LIBRETRANSLATE_API_KEY)%'
        tags:
            - { name: app.translator_provider, priority: 10 }

    App\Service\Translation\TranslatorChain:
        arguments:
            $providers: !tagged_iterator { tag: app.translator_provider }
            $translationLogger: '@monolog.logger.translation'

    #####################################
    #            Axonaut CRM            #
    #####################################

    App\Service\Axonaut\AxonautClient:
        arguments:
            $apiKey: '%env(AXONAUT_API_KEY)%'
            $enabled: '%env(bool:AXONAUT_ENABLED)%'
            $opportunityPipe: '%env(AXONAUT_OPPORTUNITY_PIPE)%'
            $opportunityStep: '%env(AXONAUT_OPPORTUNITY_STEP)%'
            $opportunityAmount: '%env(float:AXONAUT_OPPORTUNITY_AMOUNT)%'

    App\Service\Axonaut\AxonautClientInterface: '@App\Service\Axonaut\AxonautClient'

    #####################################
    #        PageSpeed Insights         #
    #####################################

    App\Service\Seo\PageSpeed\PageSpeedClient:
        arguments:
            $apiKey: '%env(PAGESPEED_API_KEY)%'
            $enabled: '%env(bool:PAGESPEED_ENABLED)%'
            $strategies: '%env(PAGESPEED_STRATEGIES)%'

    #####################################
    #         Form extensions           #
    #####################################

    form.type.datalist_type:
        lazy: true
        class: App\Form\Widget\DatalistType
        tags:
            -  { name: form.type, alias: datalist }

    App\Form\Extension\CheckboxExtension:
        lazy: true
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\CheckboxType }

    App\Form\Extension\ChoiceExtension:
        lazy: true
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\ChoiceType }

    App\Form\Extension\RadioExtension:
        lazy: true
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\RadioType }

    App\Form\Extension\TextareaEditorExtension:
        lazy: true
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\TextareaType }

    App\Form\Extension\TextareaSizeExtension:
        lazy: true
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\TextareaType }

    App\Form\Extension\TextExtension:
        lazy: true
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\TextType }

    App\Form\Extension\MainExtension:
        lazy: true
        tags:
            - { name: form.type_extension}

    mmi.dbal.mysql_platform:
        class: App\Service\Doctrine\MySqlPlatform

    #####################################
    #         Two-factor auth           #
    #####################################

    App\Security\TwoFactor\AuthCodeMailer:
        arguments:
            $senderEmail: 'noreply@up-animations.fr'
            $senderName: 'No-reply'

when@dev:
    services:
        Symfony\Component\HttpKernel\Profiler\Profiler: '@profiler'

when@local:
    services:
        Symfony\Component\HttpKernel\Profiler\Profiler: '@profiler'